<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Cart Return</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="wrap">
    <h1>CART RETURN</h1>
    <div id="game"></div>
    <p class="hint">Solo / co-op / versus &middot; attendant: arrows or WASD to walk &middot; moped rider: WASD &middot; on a phone or tablet: the on-screen stick &middot; walk over badges for shield / speed / strength &middot; dodge the angry coworkers &middot; R restart, M menu</p>
  </div>

  <!-- Phaser: local vendor copy first, CDN fallback if it is missing -->
  <script src="vendor/phaser.min.js"></script>
  <script>
    if (!window.Phaser) {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"><\/script>');
    }
  </script>
  <!-- Game sources, written out in order so execution order is preserved.
       Each gets a cache-busting query: these are plain classic scripts, and
       browsers hold on to them hard enough that an edited file keeps loading
       the previous build until you hard-reload. -->
  <script>
    [
      'src/config.js',
      'src/touch.js',
      'src/powerup.js',
      'src/obstacle.js',
      'src/player.js',
      'src/moped.js',
      'src/scenes/BootScene.js',
      'src/scenes/MenuScene.js',
      'src/scenes/GameScene.js',
      'src/scenes/HudScene.js',
      'src/main.js',
    ].forEach(function (src) {
      document.write('<script src="' + src + '?t=' + Date.now() + '"><\/script>');
    });
  </script>
</body>
</html>
